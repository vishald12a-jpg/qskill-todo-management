<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QSkill To-Do App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>

    <div class="form">

        <input
            type="text"
            id="title"
            placeholder="Task title">

        <input
            type="text"
            id="description"
            placeholder="Task description">

        <button onclick="addTask()">
            Add Task
        </button>

    </div>


    <p id="message"></p>


    <div id="taskList"></div>

</div>

<script src="script.js"></script>

</body>

</html>
